name: client-distribution
on:
  push:
    branches: [test, master]
    tags: ['v*', '*_test']
permissions:
  contents: read
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check complete public tree and reachable history
        run: python scripts/client_release.py check --tag 1.1.0_test
      - name: Build reviewed client files
        env:
          CLIENT_OUTPUT: ${{ runner.temp }}/client-output
        run: python scripts/client_release.py build --tag 1.1.0_test --output "$CLIENT_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: client-1.1.0_test
          path: ${{ runner.temp }}/client-output/1.1.0_test/
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: client-1.1.0_test
          path: ${{ runner.temp }}/client-artifacts
      - name: Recheck, upload, download-verify and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_ARTIFACTS: ${{ runner.temp }}/client-artifacts
          RELEASE_TAG: ${{ github.ref_name }}
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/client_release.py publish --tag "$RELEASE_TAG" --output "$CLIENT_ARTIFACTS" --ci-url "$CI_URL"
